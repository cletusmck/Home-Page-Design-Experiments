<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge — The Financing Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap" rel="stylesheet">
<style>
:root { --bridge-blue: #005FF1; --bridge-navy: #001A2C; --bridge-green: #00FDA4; --paper: #FFFFFF; --bg-standard: #F4F2F0; --gray-50: #F7F5F3; --gray-100: #EDEAE6; --gray-200: #DDD8D2; --gray-300: #C4BEB6; --gray-400: #9A958D; --gray-500: #6B7682; --gray-600: #4A555F; --gray-700: #37424C; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-standard); font-family: 'DM Sans', sans-serif; color: var(--bridge-navy); padding: 48px 24px; }
body > .frame { width: 1280px; margin: 0 auto; box-shadow: 0 30px 70px rgba(0,26,44,0.14); overflow: hidden; background: var(--paper); }
a { color: var(--bridge-blue); } a:hover { color: #0049C2; }
@keyframes win-fade6 { 0% { opacity: 1; visibility: visible; } 13% { opacity: 1; visibility: visible; } 16.7% { opacity: 0; visibility: hidden; } 96% { opacity: 0; visibility: hidden; } 100% { opacity: 1; visibility: visible; } }
@media (prefers-reduced-motion: reduce) {
  .win-fade { animation: none !important; opacity: 0 !important; visibility: hidden !important; }
  .win-first { opacity: 1 !important; visibility: visible !important; }
}
</style>
</head>
<body>
<div class="frame">

        <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 56px; border-bottom: 1px solid var(--gray-100)">
          <img src="../assets/logos/bridge-logo-navy.png" alt="Bridge" style="height: 18px; width: auto; display: block">
          <div style="display: flex; align-items: center; gap: 28px"><nav style="display: flex; gap: 24px; font-size: 13px; color: var(--gray-600); font-weight: 500"><span>Hotel Financing</span><span>Consumer Brands</span><span>Successes</span><span>How It Works</span></nav><span style="font-size: 13px; font-weight: 600; color: var(--paper); background: var(--bridge-navy); border-radius: 8px; padding: 9px 16px; white-space: nowrap">Get Started</span></div>
        </div>
        <div style="display: grid; grid-template-columns: 420px 1fr; gap: 52px; padding: 44px 56px 56px">
          <div>
            <h1 style="margin: 0 0 14px; font-family: 'DM Sans', sans-serif; font-weight: 400; letter-spacing: -0.015em; font-size: 48px; line-height: 1.05; color: var(--bridge-navy)">What are you financing?</h1>
            <p style="margin: 0 0 26px; font-size: 15px; line-height: 1.55; color: var(--gray-600)">Tell us what you're working on and we'll show you how Bridge can help.</p>
            <div id="options" style="display: flex; flex-direction: column; gap: 10px"></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 18px">
            <div style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-500); font-weight: 600">Based on your selection</div>
            <div style="width: 100%; height: 300px; border-radius: 12px; overflow: hidden; background: var(--gray-100)"><img id="p-img" src="" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></div>
            <div style="display: grid; grid-template-columns: 1fr 290px; gap: 26px; align-items: start">
              <div style="display: flex; flex-direction: column; gap: 7px">
                <div id="p-name" style="font-size: 15.5px; font-weight: 600; color: var(--bridge-navy)"></div>
                <div id="p-amount" style="font-family: 'DM Sans', sans-serif; font-weight: 400; letter-spacing: -0.015em; font-size: 40px; line-height: 1; color: var(--bridge-navy); font-variant-numeric: tabular-nums"></div>
                <div id="p-role" style="font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--bridge-blue)"></div>
                <div id="p-desc" style="font-size: 13.5px; line-height: 1.55; color: var(--gray-600); margin-top: 4px"></div>
              </div>
              <div style="background: var(--bg-standard); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
                <div id="p-quote" style="font-size: 13.5px; line-height: 1.6; color: var(--gray-700)"></div>
                <div id="p-attr" style="font-size: 12.5px; color: var(--gray-500)"></div>
              </div>
            </div>
            <div><span style="display: inline-flex; align-items: center; gap: 10px; background: var(--bridge-blue); color: var(--paper); font-size: 14px; font-weight: 600; padding: 13px 26px; border-radius: 9px; cursor: pointer">Continue <span>&rarr;</span></span></div>
          </div>
        </div>
</div>
<script>
const W = '../assets/images/wins/';
const deals = [
  { label: 'Build a hotel', img: W + 'groundbreaking.png', name: 'Hotel New Construction', amount: 'Tru by Hilton', role: 'Bridge Direct Lending', desc: 'Senior construction loan · 106 keys · Ground-up development', quote: '“Bridge was the right partner from the start. They understood the project and moved quickly to get us to funding.”', attr: '— Owner / Developer' },
  { label: 'Complete a PIP / Renovation', img: '../assets/images/hotel-exterior.jpg', name: 'Hotel PIP / Renovation', amount: '$12,500,000', role: 'Bridge Direct Lending', desc: 'Brand-mandated PIP, select-service hotel', quote: '“Bridge understood our goal and structured a solution that got us across the finish line.”', attr: '— Owner, Select-Service Hotel' },
  { label: 'Acquire or refinance a hotel', img: W + 'hampton-refi.png', name: 'Hotel Refinance', amount: '$18,500,000', role: 'Financing Secured by Bridge', desc: 'CMBS refinance with cash-out · Closed in 35 days', quote: '“They translated a complicated capital stack into one clear path to closing.”', attr: '— Hotel Owner' },
  { label: 'Finance inventory', img: W + 'dog-sauce.png', name: 'Consumer Brand in Retail', amount: '3,000 Walmart doors', role: 'Bridge Direct Lending', desc: 'New SKU launch, production financing', quote: '“We had the demand in place. Bridge gave us the capital to deliver.”', attr: '— CEO, Consumer Brand' },
  { label: 'Fulfill a purchase order', img: W + 'ice-cream.png', name: 'Walmart Supplier Production', amount: '$500,000', role: 'Bridge Direct Lending', desc: 'Production financing tied to an approved Walmart order', quote: '“The order was real. Bridge made sure the production was funded.”', attr: '— Founder' },
  { label: 'Fund receivables / working capital', img: W + 'dog-sauce.png', name: 'Consumer Brand Working Capital', amount: '$5,000,000', role: 'Bridge Direct Lending', desc: 'Working capital against receivables in retail', quote: '“Our cash stayed in the business while the orders shipped.”', attr: '— Operator' },
  { label: 'Complete a business acquisition', img: W + 'ups-store.png', name: 'Location Purchase', amount: '$750,000', role: 'Bridge Direct Lending', desc: 'The UPS Store location purchase', quote: '“Bridge kept the purchase on schedule from request to funded.”', attr: '— Franchise Owner' }
];
let sel = 0;
const list = document.getElementById('options');
function renderOptions(){
  list.innerHTML = '';
  deals.forEach((d, i) => {
    const on = i === sel;
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; align-items:center; gap:12px; border:1.5px solid ' + (on ? 'var(--bridge-blue)' : 'var(--gray-300)') + '; background:' + (on ? '#EDF3FE' : 'var(--paper)') + '; border-radius:999px; padding:12px 18px; cursor:pointer';
    row.innerHTML = '<span style="box-sizing:border-box; width:16px; height:16px; border-radius:999px; border:1.5px solid ' + (on ? 'var(--bridge-blue)' : 'var(--gray-400)') + '; background:' + (on ? 'var(--bridge-blue)' : 'transparent') + '; background-clip:content-box; padding:3px"></span><span style="font-size:14px; font-weight:' + (on ? '600' : '500') + '; color:var(--bridge-navy)">' + d.label + '</span>';
    row.onclick = () => { sel = i; render(); };
    list.appendChild(row);
  });
}
function render(){
  renderOptions();
  const c = deals[sel];
  document.getElementById('p-img').src = c.img;
  for (const k of ['name','amount','role','desc','quote','attr']) document.getElementById('p-' + k).textContent = c[k];
}
render();
</script>
</body>
</html>

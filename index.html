<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge — Home Page Design Experiments</title>
<meta name="robots" content="noindex">
<style>
@font-face {
  font-family: Mabrypro;
  src: url("https://cdn.prod.website-files.com/67e6ce1c227912a33fb840d1/694ce5720a8dec4a7b38deb4_MabryPro.otf") format("opentype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
:root {
  --navy: #001b2e;
  --blue: #005ff1;
  --cream: #f4f2f0;
  --sans: Mabrypro, "Helvetica Neue", Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: var(--navy); font-family: var(--sans); }

.stage { position: fixed; inset: 0; }
.stage iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--cream);
  opacity: 1;
  transition: opacity 0.25s ease;
}
.stage iframe.fading { opacity: 0; }

/* Ever-present arrows on top of the designs */
.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 100;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: rgba(0, 27, 46, 0.72);
  color: #fff;
  display: grid;
  place-items: center;
  backdrop-filter: blur(6px);
  box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
  transition: background 0.2s, transform 0.15s;
}
.arrow:hover { background: var(--blue); transform: translateY(-50%) scale(1.06); }
.arrow svg { width: 22px; height: 22px; }
.arrow.prev { left: 18px; }
.arrow.next { right: 18px; }

/* Version chip, top center */
.chip {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0, 27, 46, 0.78);
  color: #fff;
  backdrop-filter: blur(6px);
  border-radius: 100px;
  padding: 9px 10px 9px 18px;
  font-size: 13px;
  letter-spacing: 0.02em;
  box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
  white-space: nowrap;
}
.chip .v { color: #8fb8ff; }
.chip .title { color: #fff; }
.chip .author { color: rgba(255, 255, 255, 0.55); font-size: 12px; }
.chip .count {
  background: rgba(255, 255, 255, 0.14);
  border-radius: 100px;
  padding: 5px 12px;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.8);
}
.chip a.open {
  display: grid;
  place-items: center;
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  text-decoration: none;
}
.chip a.open:hover { background: var(--blue); }
.chip a.open svg { width: 13px; height: 13px; }

/* Dots, bottom center */
.dots {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  gap: 8px;
  background: rgba(0, 27, 46, 0.72);
  backdrop-filter: blur(6px);
  border-radius: 100px;
  padding: 9px 12px;
}
.dots button {
  width: 9px; height: 9px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.35);
  transition: background 0.2s, transform 0.2s;
}
.dots button.on { background: #fff; transform: scale(1.25); }
.dots button:hover { background: var(--blue); }

@media (max-width: 640px) {
  .arrow { width: 46px; height: 46px; }
  .arrow.prev { left: 10px; }
  .arrow.next { right: 10px; }
  .chip .author { display: none; }
}
</style>
</head>
<body>

<div class="stage"><iframe id="frame" title="Design concept" src="about:blank"></iframe></div>

<button class="arrow prev" id="prev" aria-label="Previous concept">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
</button>
<button class="arrow next" id="next" aria-label="Next concept">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<div class="chip" id="chip">
  <span><span class="v" id="vlabel">V1</span> · <span class="title" id="tlabel"></span></span>
  <span class="author" id="alabel"></span>
  <span class="count" id="count"></span>
  <a class="open" id="openraw" href="#" target="_blank" rel="noopener" title="Open this concept full screen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
  </a>
</div>

<div class="dots" id="dots"></div>

<script src="concepts.js?v=2"></script>
<script>
(function () {
  var list = window.CONCEPTS || [];
  var frame = document.getElementById("frame");
  var dots = document.getElementById("dots");
  var idx = 0;

  // Build dots
  list.forEach(function (_, i) {
    var b = document.createElement("button");
    b.setAttribute("aria-label", "Go to V" + (i + 1));
    b.addEventListener("click", function () { go(i); });
    dots.appendChild(b);
  });

  function render() {
    var c = list[idx];
    document.getElementById("vlabel").textContent = "V" + (idx + 1);
    document.getElementById("tlabel").textContent = c.title;
    document.getElementById("alabel").textContent = c.author ? "by " + c.author : "";
    document.getElementById("count").textContent = (idx + 1) + " / " + list.length;
    document.getElementById("openraw").href = c.file;
    Array.prototype.forEach.call(dots.children, function (d, i) {
      d.classList.toggle("on", i === idx);
    });
    frame.classList.add("fading");
    setTimeout(function () {
      frame.src = c.file;
      frame.onload = function () { frame.classList.remove("fading"); };
    }, 200);
    if (history.replaceState) history.replaceState(null, "", "#v" + (idx + 1));
  }

  function go(i) {
    idx = (i + list.length) % list.length;
    render();
  }

  document.getElementById("prev").addEventListener("click", function () { go(idx - 1); });
  document.getElementById("next").addEventListener("click", function () { go(idx + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") go(idx - 1);
    if (e.key === "ArrowRight") go(idx + 1);
  });

  // Deep link: #v3 opens V3
  var m = (location.hash || "").match(/^#v(\d+)$/i);
  if (m) idx = Math.min(Math.max(parseInt(m[1], 10) - 1, 0), list.length - 1);
  render();
})();
</script>

</body>
</html>
